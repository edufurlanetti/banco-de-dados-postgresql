services:
  postgres:
    image: postgres:16
    container_name: academico-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faculdade
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./scripts/02_funcoes.sql:/docker-entrypoint-initdb.d/02_funcoes.sql
      - ./scripts/03_dados.sql:/docker-entrypoint-initdb.d/03_dados.sql
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: academico-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  pg_data:
